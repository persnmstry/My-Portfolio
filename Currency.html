<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="currency.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">
</head>
<body>

    <header>
        <!-- <a class="title" href="https://lancaster.edu.gh/">
         <img src="LUG logo.png" alt="School Logo" width="180" height="auto">
        </a> -->
    </header>

<div class="main-container">
    <main class="converter-box">
        <div class="rate-header">
            <span class="rate-title">Mid-market exchange rate ℹ️</span>
            <div id="rate-display" class="rate-value">1 USD = -- GHS</div>
        </div>
        
        <div class="input-group">
            <label for="amount">Amount</label>
            <div class="input-wrapper">
                <input type="number" id="amount" value="1" min="1">

                <img id="from-flag" class="flag-icon" src="https://flagcdn.com/w40/us.png" alt="USD Flag">
                <select id="from-currency">
                    <option value="USD" data-code="us" selected>USD</option>
                    <option value="GHS" data-code="gh">GHS</option>
                    <option value="EUR" data-code="eu">EUR</option>
                    <option value="NGN" data-code="ng">NGN</option>
                    <option value="GBP" data-code="gb">GBP</option>
                    <option value="CAD" data-code="ca">CAD</option>
                    <option value="AUD" data-code="au">AUD</option>
                    <option value="JPY" data-code="jp">JPY</option>
                    <option value="CNY" data-code="cn">CNY</option>
                    <option value="KES" data-code="ke">KES</option>
                    <option value="ZAR" data-code="za">ZAR</option>
                </select>
            </div>
        </div>

        <div class="swap-container">
            <button id="swap-btn" title="Swap Currencies">⇅</button>
        </div>

        <div class="input-group">
            <label for="result">Converted to</label>
            <div class="input-wrapper">
                <input type="text" id="result" placeholder="0.00" readonly>
                <img id="to-flag" class="flag-icon" src="https://flagcdn.com/w40/gh.png" alt="GHS Flag">
                <select id="to-currency">
                    <option value="USD" data-code="us">USD</option>
                    <option value="GHS" data-code="gh" selected>GHS</option>
                    <option value="EUR" data-code="eu">EUR</option>
                    <option value="NGN" data-code="ng">NGN</option>
                    <option value="GBP" data-code="gb">GBP</option>
                    <option value="CAD" data-code="ca">CAD</option>
                    <option value="AUD" data-code="au">AUD</option>
                    <option value="JPY" data-code="jp">JPY</option>
                    <option value="CNY" data-code="cn">CNY</option>
                    <option value="KES" data-code="ke">KES</option>
                    <option value="ZAR" data-code="za">ZAR</option>
                    <option value="CFA" data-code=""></option>
                </select>
            </div>
        </div>
    
        <button id="convert-btn">Convert</button>
    </main>
