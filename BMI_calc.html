<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Index Calculator</title>
    <link rel="stylesheet" href="bmi.css">
</head>
<body>
    <div class="container">
    <h1 class="head">BMI Calculator</h1>
    
    <p class="height">
        Height (cm)<br>
        <input class="inputH" type="number">
    </p>

    <p class="weight">
        Weight (kg)<br>
        <input class="inputW" type="number">
    </p>
    
    <button>Calculate</button>
    
    <div id="results">
        <p>Your BMI is:</p>
    </div>
</div>
    <script src="bmi.js"></script>
</body>
</html>
